version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mini_erp_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mini_erp_db
      MYSQL_USER: erpuser
      MYSQL_PASSWORD: erppassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mini_erp_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: mini_erp_db
      DB_USER: erpuser
      DB_PASS: erppassword
      JWT_SECRET: super_secret_jwt_key_mini_erp_docker
      JWT_EXPIRY: 24h
      FRONTEND_ORIGIN: http://localhost
    depends_on:
      - db
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mini_erp_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  backend_uploads:
