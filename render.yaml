databases:
  - name: mini-erp-crm-db
    databaseName: mini_erp_crm
    user: mini_erp_user
    plan: free

services:
  - type: web
    name: mini-erp-crm-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mini-erp-crm-db
          property: connectionString
      - key: DB_DIALECT
        value: mysql
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRY
        value: 1d
      - key: FRONTEND_ORIGIN
        sync: false
